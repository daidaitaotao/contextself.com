<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <style>
      .box{fill:#f7f5f0;stroke:#1f2d3a;stroke-width:2;rx:12;ry:12}
      .title{font:600 16px 'Georgia', serif; fill:#1f2d3a}
      .text{font:400 13px 'Georgia', serif; fill:#1f2d3a}
      .arrow{stroke:#1f2d3a;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1f2d3a"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="40" width="140" height="60"/>
  <text class="title" x="48" y="72">Media</text>
  <text class="text" x="48" y="92">photos/video</text>

  <rect class="box" x="200" y="40" width="140" height="60"/>
  <text class="title" x="220" y="72">Frames</text>
  <text class="text" x="220" y="92">ImageFrame</text>

  <rect class="box" x="370" y="40" width="160" height="60"/>
  <text class="title" x="390" y="72">Extractors</text>
  <text class="text" x="390" y="92">face/pose/scene</text>

  <rect class="box" x="560" y="40" width="150" height="60"/>
  <text class="title" x="578" y="72">Graph</text>
  <text class="text" x="578" y="92">people + edges</text>

  <rect class="box" x="740" y="40" width="140" height="60"/>
  <text class="title" x="758" y="72">Metrics</text>
  <text class="text" x="758" y="92">balance/flow</text>

  <rect class="box" x="560" y="140" width="150" height="60"/>
  <text class="title" x="575" y="172">Equilibrium</text>
  <text class="text" x="575" y="192">stability check</text>

  <rect class="box" x="740" y="140" width="140" height="60"/>
  <text class="title" x="760" y="172">Report</text>
  <text class="text" x="760" y="192">allow / refuse</text>

  <line class="arrow" x1="170" y1="70" x2="200" y2="70"/>
  <line class="arrow" x1="340" y1="70" x2="370" y2="70"/>
  <line class="arrow" x1="530" y1="70" x2="560" y2="70"/>
  <line class="arrow" x1="710" y1="70" x2="740" y2="70"/>
  <line class="arrow" x1="635" y1="100" x2="635" y2="140"/>
  <line class="arrow" x1="710" y1="170" x2="740" y2="170"/>

  <text class="text" x="30" y="235">Conservative decision rules gate interpretation.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260">
  <defs>
    <style>
      .box{fill:#f7f5f0;stroke:#1f2d3a;stroke-width:2;rx:12;ry:12}
      .title{font:600 16px 'Georgia', serif; fill:#1f2d3a}
      .text{font:400 13px 'Georgia', serif; fill:#1f2d3a}
      .arrow{stroke:#1f2d3a;stroke-width:2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1f2d3a"/>
    </marker>
  </defs>
  <rect class="box" x="30" y="40" width="150" height="60"/>
  <text class="title" x="48" y="72">Signals</text>
  <text class="text" x="48" y="92">features, edges</text>

  <rect class="box" x="210" y="40" width="170" height="60"/>
  <text class="title" x="226" y="72">Graph + State</text>
  <text class="text" x="226" y="92">nodes, vector</text>

  <rect class="box" x="410" y="40" width="150" height="60"/>
  <text class="title" x="428" y="72">Metrics</text>
  <text class="text" x="428" y="92">balance/flow</text>

  <rect class="box" x="590" y="40" width="200" height="60"/>
  <text class="title" x="610" y="72">Equilibrium</text>
  <text class="text" x="610" y="92">fixed-point loop</text>

  <rect class="box" x="590" y="140" width="200" height="60"/>
  <text class="title" x="610" y="172">Result</text>
  <text class="text" x="610" y="192">converged + diag</text>

  <line class="arrow" x1="180" y1="70" x2="210" y2="70"/>
  <line class="arrow" x1="380" y1="70" x2="410" y2="70"/>
  <line class="arrow" x1="560" y1="70" x2="590" y2="70"/>
  <line class="arrow" x1="690" y1="100" x2="690" y2="140"/>

  <text class="text" x="30" y="225">TaoCore core flow: deterministic metrics + stability search</text>
</svg>
